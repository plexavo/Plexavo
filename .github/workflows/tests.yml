name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep this in sync with requires-python in pyproject.toml. 3.14 is
        # included deliberately, not just the floor — argparse got stricter
        # there and annotation evaluation changed (PEP 649), both worth
        # catching automatically rather than finding out from a bug report.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev + ai extras)
        run: pip install -e ".[dev,ai]"

      - name: Run offline test suite
        # These are script-style test files (assert_true + sys.exit), not
        # pytest test_ functions — run each directly so a failure actually
        # fails the job. See CONTRIBUTING.md for the open item to convert
        # this to proper pytest.
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: Smoke-test the installed CLI
        run: |
          plexavo --version
          plexavo --help
          plexavo scan --help
          # The Windows install path (README): run via -m, no console script.
          python -m plexavo --version
          python -m plexavo scan --help
